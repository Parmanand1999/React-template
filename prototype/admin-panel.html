<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPDP Admin Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: SaaS admin shell — fixed sidebar nav, top bar, page content with an explainer strip on every screen */
:root{
  --bg:#f1f4f2; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#16201b; --muted:#5a665f; --line:#dbe2de;
  --accent:#0b6e57; --accent-ink:#ffffff; --accent-soft:#e0f0ea;
  --side:#10231c; --side-ink:#cfe0d8; --side-muted:#7f978b; --side-active:#1d3a2f;
  --ok:#1b7a3d; --ok-soft:#e0f3e6; --bad:#b0362e; --bad-soft:#fae3e0; --warn:#985f00; --warn-soft:#f8edd6; --info:#2d5aa8; --info-soft:#e3ebf8;
  --code-bg:#13201a; --code-fg:#d4e6dc; --shadow:0 12px 32px rgba(16,35,28,.14);
  --f-display:"Space Grotesk","Noto Sans Devanagari",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1210; --surface:#151c19; --surface-2:#1a2320; --ink:#e3ebe6; --muted:#95a49c; --line:#29342f;
  --accent:#3fbf98; --accent-ink:#04140e; --accent-soft:#173a30;
  --side:#0a0f0d; --side-ink:#cfe0d8; --side-muted:#7a8f85; --side-active:#173029;
  --ok:#62c985; --ok-soft:#163222; --bad:#ef7d74; --bad-soft:#3a1c1a; --warn:#e3aa3d; --warn-soft:#3a2c12; --info:#8fb0f0; --info-soft:#1b2740;
  --code-bg:#0a0f0d; --code-fg:#cfe2d8; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1210; --surface:#151c19; --surface-2:#1a2320; --ink:#e3ebe6; --muted:#95a49c; --line:#29342f;
  --accent:#3fbf98; --accent-ink:#04140e; --accent-soft:#173a30;
  --side:#0a0f0d; --side-ink:#cfe0d8; --side-muted:#7a8f85; --side-active:#173029;
  --ok:#62c985; --ok-soft:#163222; --bad:#ef7d74; --bad-soft:#3a1c1a; --warn:#e3aa3d; --warn-soft:#3a2c12; --info:#8fb0f0; --info-soft:#1b2740;
  --code-bg:#0a0f0d; --code-fg:#cfe2d8; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:12px}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:16px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:6px 10px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto;background:var(--warn);color:#1a1200;border-radius:999px;font-size:10px;padding:0 6px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 10px;display:flex;flex-direction:column;gap:6px}
.side .foot a{color:var(--side-ink)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.site-switch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface-2)}
.site-switch select{border:0;background:transparent;font-weight:600}
.topbar .grow{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.content{padding:24px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .2s;height:100%}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:inline-block}
  .content,.topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* common */
.page-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.page-head h1{font-size:24px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:15px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g4,.g2,.g3,.g-2-1{grid-template-columns:minmax(0,1fr)}}

.explain{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.explain{grid-template-columns:minmax(0,1fr)}}
.explain h4{font-size:13px;color:var(--info);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.explain ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.explain .api{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:3px}
.explain .api span b{color:var(--info);font-weight:600;display:inline-block;min-width:46px}
.explain-toggle{font-size:12px}

.stat .v{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:12px}
.up{color:var(--ok)}.down{color:var(--bad)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--surface-2)}
td{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.pchips{display:flex;gap:4px;flex-wrap:wrap}
.pc{font-size:10px;font-family:var(--f-mono);padding:1px 6px;border-radius:4px}
.pc.on{background:var(--ok-soft);color:var(--ok)}.pc.off{background:var(--surface-2);color:var(--muted);text-decoration:line-through}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,.select,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500}
.field .hint{font-weight:400;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* bar chart */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:180px;padding-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;position:relative}
.bar .seg-a{background:var(--accent);border-radius:4px 4px 0 0}
.bar .seg-r{background:color-mix(in srgb,var(--bad) 55%,transparent)}
.bar .lab{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.bar .num{font-size:10px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.purpose-row{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}

.activity{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.activity li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.activity li:last-child{border-bottom:0}
.activity time{color:var(--muted);font-size:11px;white-space:nowrap;font-family:var(--f-mono);padding-top:2px}

/* switch */
.switch{position:relative;width:38px;height:22px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+span{opacity:.5}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* banner designer preview */
.preview-frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.preview-chrome{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.preview-chrome i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.preview-site{position:relative;height:420px;background:repeating-linear-gradient(0deg,transparent 0 38px,var(--surface-2) 38px 40px);overflow:hidden}
.ph-line{height:12px;border-radius:4px;background:var(--line);margin:18px 20px 0}
.cb{position:absolute;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;border-radius:12px}
.cb.bar{left:10px;right:10px;bottom:10px}
.cb.box{left:10px;bottom:10px;width:min(320px,calc(100% - 20px))}
.cb.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 20px))}
.cb h5{margin:0;font-family:var(--f-display);font-size:15px}
.cb p{font-size:12px;color:var(--muted)}
.cb .acts{display:flex;gap:6px;flex-wrap:wrap}
.cb .acts span{flex:1 1 90px;text-align:center;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.cb .acts span.p{color:#fff}
.swatches{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,12,.45);z-index:40;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--surface);width:min(460px,100%);height:100%;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dialog{background:var(--surface);width:min(460px,100%);max-height:100%;overflow:auto;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline li.pending::before{background:var(--line)}
.timeline small{display:block;color:var(--muted);font-size:11px}

pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);padding:16px;border-radius:10px;font-family:var(--f-mono);font-size:12px;line-height:1.6;overflow-x:auto}
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .dialog{box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- plugin UI (end-user side) ---------- */
.steps-seg{display:flex;flex-wrap:wrap;gap:6px}
.steps-seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps-seg button b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);font-size:10px}
.steps-seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps-seg button[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.pv-stage{display:flex;justify-content:center;min-width:0}
.pv-site{position:relative;height:540px;background:var(--surface);overflow:hidden}
.pv-site .fake{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.pv-site .fake .nav{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted)}
.pv-site .fake .blk{height:12px;border-radius:4px;background:var(--surface-2)}
.pv-site .fake .hero{height:110px;border-radius:10px;background:var(--surface-2)}
.pv-site .fake .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pv-site .fake .row3 div{height:70px;border-radius:8px;background:var(--surface-2)}
.pv-site .sitefoot{position:absolute;left:0;right:0;bottom:0;padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:14px;justify-content:flex-end;background:var(--surface)}
.pv-site .sitefoot button{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;font-size:11px}
.phone{width:min(340px,100%);border:10px solid var(--ink);border-radius:34px;overflow:hidden;position:relative}
.phone .pv-site{height:620px}
.phone .pv-site .fake .row3{grid-template-columns:minmax(0,1fr)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:20px;background:var(--ink);border-radius:0 0 12px 12px;z-index:9}
.pw-dim{position:absolute;inset:0;background:rgba(8,16,12,.45);z-index:4}
.pw{position:absolute;z-index:5;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 24px);overflow:auto}
.pw.bar{left:12px;right:12px;bottom:44px}
.pw.box{left:12px;bottom:44px;width:min(340px,calc(100% - 24px))}
.pw.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 24px))}
.pw.sheet{left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:88%;border-bottom:0}
.pw-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pw h5{margin:0;font-family:var(--f-display);font-size:16px}
.pw .txt{font-size:12.5px;color:var(--muted)}
.pw .small{font-size:10.5px;color:var(--muted)}
.pw .langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.pw .langs button{border:0;background:transparent;padding:2px 8px;font-size:11px;color:var(--muted)}
.pw .langs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.pw .agechips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.pw .chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:11.5px}
.pw .chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:600}
.pw .acts{display:flex;flex-wrap:wrap;gap:8px}
.pb{flex:1 1 110px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600}
.pb.p{background:var(--brand);border-color:var(--brand);color:#fff}
.pb.d{color:var(--bad);border-color:var(--bad)}
.pw .prow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pw .prow .t{font-weight:600;font-size:13px}.pw .prow .d{font-size:11.5px;color:var(--muted)}
.pw .prow .r{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.pv .switch input:checked+span{background:var(--brand)}
.pw .inp{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:var(--surface);width:100%}
.pw label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:500}
.pw .otp{display:flex;gap:6px}.pw .otp span{width:38px;height:42px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:16px;font-weight:600}
.pw .rcpt{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.pw .ok-ic{width:40px;height:40px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:20px;font-weight:700}
.pfab{position:absolute;left:12px;bottom:44px;z-index:5;border:0;border-radius:999px;background:var(--brand);color:#fff;padding:8px 14px;font-size:12px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.ptoast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:12px;display:flex;gap:10px;align-items:center;white-space:nowrap;max-width:calc(100% - 24px)}
.ptoast button{border:0;background:none;color:inherit;text-decoration:underline;font-size:12px;padding:0}
.reco-strip{border:1px dashed var(--brand);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.notes li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.notes li::before{content:"✓";color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
"use strict";
/* ================= sample data (sab fake hai) ================= */
const SITES=[
  {id:'site_7f3a21',name:'Demo Realty Website',url:'demorealty.example',platform:'Website (script tag)',status:'Live',consents:1284,created:'02 Nov 2026'},
  {id:'site_9c11e0',name:'Demo Realty Android',url:'com.demorealty.app',platform:'Android SDK',status:'Testing',consents:212,created:'14 Nov 2026'},
  {id:'site_2b88d4',name:'Demo Realty Blog',url:'blog.demorealty.example',platform:'WordPress plugin',status:'Not installed',consents:0,created:'19 Nov 2026'}
];
let PURPOSES=[
  {id:'essential',name:'Essential',desc:'Login, security aur cart. Bina iske site nahi chalegi.',required:true,retention:'Session tak',scripts:['session.js'],on:true},
  {id:'analytics',name:'Analytics',desc:'Log site kaise use karte hain, yeh samajhna.',required:false,retention:'13 mahine',scripts:['gtag.js','clarity.js'],on:true},
  {id:'marketing',name:'Marketing',desc:'Property offers SMS, email aur WhatsApp par bhejna.',required:false,retention:'24 mahine',scripts:['fbevents.js','whatsapp-api'],on:true},
  {id:'personalisation',name:'Personalisation',desc:'Searches ke hisaab se listings dikhana.',required:false,retention:'12 mahine',scripts:['reco-engine.js'],on:true}
];
const LANGS=[['en','English',true],['hi','हिंदी',true],['mr','मराठी',false],['bn','বাংলা',false],['ta','தமிழ்',false],['te','తెలుగు',false],['gu','ગુજરાતી',false],['kn','ಕನ್ನಡ',false]];
const ACTIONS=['ACCEPT_ALL','REJECT_ALL','CUSTOM','UPDATE','WITHDRAW'];
function seedLogs(){const out=[];const now=new Date('2026-11-20T12:40:00');for(let i=0;i<24;i++){const a=ACTIONS[[0,0,1,2,0,3,0,1,4,0,2,0,0,1,2,0,4,0,3,0,1,0,2,0][i]];const p=a==='ACCEPT_ALL'?{analytics:1,marketing:1,personalisation:1}:a==='REJECT_ALL'||a==='WITHDRAW'?{analytics:0,marketing:0,personalisation:0}:{analytics:1,marketing:i%2,personalisation:(i+1)%2};out.push({receipt:'RCPT-'+(84213-i*37).toString(36).toUpperCase(),user:'usr_'+(9000+i*131).toString(16),action:a,p,ts:new Date(now-i*23*60000),lang:i%3===0?'hi':'en',age:i===5||i===13?'under 18':'18+',platform:i%4===3?'Android':'Web',notice:i>15?'v1.1':'v1.2'});}return out;}
const LOGS=seedLogs();
let REQS=[
  {id:'REQ-4K2P9A',type:'Erasure',name:'Rahul S.',email:'rahul.sample@example.com',ts:'18 Nov 2026',due:'16 Feb 2027',status:'New',msg:'Mera account aur saara data delete kar dijiye.'},
  {id:'REQ-7HQ31M',type:'Access',name:'Priya K.',email:'priya.k@example.com',ts:'17 Nov 2026',due:'15 Feb 2027',status:'In progress',msg:'Aapke paas mera kaun sa data hai, uski copy chahiye.'},
  {id:'REQ-2ZX8WD',type:'Grievance',name:'Amit V.',email:'amit.v@example.com',ts:'15 Nov 2026',due:'13 Feb 2027',status:'New',msg:'Consent withdraw karne ke baad bhi SMS aa rahe hain.'},
  {id:'REQ-9PL0RT',type:'Correction',name:'Neha J.',email:'neha.j@example.com',ts:'10 Nov 2026',due:'08 Feb 2027',status:'Resolved',msg:'Mera phone number galat save hai.'},
  {id:'REQ-1BV6YE',type:'Nominate',name:'Suresh P.',email:'suresh.p@example.com',ts:'06 Nov 2026',due:'04 Feb 2027',status:'Resolved',msg:'Meri beti ko nominee banana hai.'},
  {id:'REQ-5MN4CS',type:'Erasure',name:'Kavya R.',email:'kavya.r@example.com',ts:'04 Nov 2026',due:'02 Feb 2027',status:'Rejected',msg:'Data delete karo.'}
];
let BREACHES=[{id:'BR-2026-001',title:'Staging DB public ho gaya tha',found:'03 Nov 2026',affected:340,data:'Naam, phone',status:'Board ko report kiya',users:'Users ko email bheja'}];
let banner={pos:'bar',color:'#0b6e57',title:'We value your privacy',body:'We use your data for the purposes below. You can change or withdraw your consent anytime.',lang:'en'};
const HI_PREVIEW={title:'हम आपकी गोपनीयता का सम्मान करते हैं',body:'हम आपका डेटा नीचे दिए उद्देश्यों के लिए इस्तेमाल करते हैं। आप कभी भी सहमति बदल या वापस ले सकते हैं।',accept:'सभी स्वीकार करें',reject:'सभी अस्वीकार करें',manage:'उद्देश्य चुनें'};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let site=SITES[0].id, loggedIn=true, showExplain=true, logFilter='all', logSearch='', reqFilter='all', drawer=null, dialog=null;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2800);}
const statusPill=s=>({'New':'info','In progress':'warn','Resolved':'ok','Rejected':'bad','Live':'ok','Testing':'warn','Not installed':'neutral'}[s]||'neutral');
const actionPill=a=>({ACCEPT_ALL:'ok',CUSTOM:'info',UPDATE:'info',REJECT_ALL:'warn',WITHDRAW:'bad'}[a]);
const pchips=p=>`<div class="pchips">${['analytics','marketing','personalisation'].map(k=>`<span class="pc ${p[k]?'on':'off'}">${k.slice(0,5)}</span>`).join('')}</div>`;
const ICON={
 dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
 sites:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
 purposes:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>',

 breach:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
 install:'<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/>'
};
const ico=k=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ================= pages ================= */
const PAGES={
 dashboard:{nav:'Dashboard',icon:'dash',group:'Overview',
  explain:{what:'Site owner login karte hi yeh dekhega. Ek nazar mein pata chale ki compliance ki halat kya hai.',
   build:['4 stat cards (total consents, acceptance rate, withdrawals, pending requests)','7 din ka consent chart','Purpose-wise acceptance meter','Recent activity list','Deadline paas aane wali requests ka alert'],
   api:[['GET','/v1/sites/{id}/stats?range=7d'],['GET','/v1/sites/{id}/activity?limit=10']]},
  render(){
   const days=[['14',142,38],['15',168,41],['16',121,30],['17',190,52],['18',176,44],['19',205,49],['20',96,21]];const mx=Math.max(...days.map(d=>d[1]+d[2]));
   return `
   <div class="grid g4">
    ${stat('Total consents','1,284','+12% pichhle hafte se','up')}
    ${stat('Acceptance rate','78.4%','Accept all ya custom','')}
    ${stat('Withdrawals','37','+5 is hafte','down')}
    ${stat('Pending requests','3','Sabse paas deadline: 13 Feb 2027','')}
   </div>
   <div class="grid g-2-1">
    <div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3>Pichhle 7 din ke consents</h3><div class="legend"><span><i style="background:var(--accent)"></i>Diya</span><span><i style="background:color-mix(in srgb,var(--bad) 55%,transparent)"></i>Reject / withdraw</span></div></div>
     <div class="bars">${days.map(d=>`<div class="bar"><span class="num">${d[1]+d[2]}</span><div class="seg-r" style="height:${d[2]/mx*150}px"></div><div class="seg-a" style="height:${d[1]/mx*150}px;order:-1"></div><span class="lab">${d[0]} Nov</span></div>`).join('')}</div>
    </div>
    <div class="card"><h3>Purpose-wise acceptance</h3>
     ${[['Analytics',82],['Marketing',41],['Personalisation',63]].map(([n,v])=>`<div class="purpose-row"><span>${n}</span><div class="meter"><span style="width:${v}%"></span></div><span class="mono">${v}%</span></div>`).join('')}
     <p class="muted" style="font-size:12px">Marketing sabse kam hai. Iska notice text aur saaf likhne se fayda ho sakta hai.</p>
    </div>
   </div>
   <div class="grid g2">
    <div class="card"><h3>Recent activity</h3><ul class="activity">
     ${LOGS.slice(0,6).map(l=>`<li><time>${l.ts.toTimeString().slice(0,5)}</time><span><span class="pill ${actionPill(l.action)}">${l.action}</span> <span class="mono">${l.user}</span> · ${l.platform}${l.age==='under 18'?' · <span class="pill warn">under 18</span>':''}</span></li>`).join('')}
    </ul><a href="#logs" class="btn sm" style="align-self:flex-start">Saare logs dekho</a></div>
    <div class="card"><h3>Dhyan dene wali cheezein</h3><ul class="activity">
     <li><span class="pill info">New</span><span>2 naye rights requests aaye hain. <a href="#rights">Dekho</a></span></li>
     <li><span class="pill warn">Notice</span><span>8 consent records purane notice v1.1 par hain. Unse dobara consent lena hoga.</span></li>
     <li><span class="pill neutral">Setup</span><span>Demo Realty Blog par plugin abhi install nahi hua. <a href="#install">Install guide</a></span></li>
     <li><span class="pill ok">Breach</span><span>BR-2026-001 Board ko report ho chuka hai.</span></li>
    </ul></div>
   </div>`;}},
 sites:{nav:'Websites & Apps',icon:'sites',group:'Setup',
  explain:{what:'Ek company ki kai websites ya apps ho sakti hain. Har ek ka alag siteId aur alag settings hongi.',
   build:['Sites ki list table','"Add website / app" form (naam, URL, platform)','Har site ka status: Live, Testing, Not installed','Top bar mein site switcher'],
   api:[['GET','/v1/sites'],['POST','/v1/sites'],['PATCH','/v1/sites/{id}']]},
  render(){return `
   <div class="toolbar"><button class="btn primary" data-act="addSite">+ Add website / app</button></div>
   <div class="tablewrap"><table><thead><tr><th>Naam</th><th>URL / package</th><th>Platform</th><th>Site ID</th><th>Consents</th><th>Status</th><th>Banaya</th></tr></thead><tbody>
   ${SITES.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td class="mono">${esc(s.url)}</td><td>${s.platform}</td><td class="mono">${s.id}</td><td>${s.consents.toLocaleString('en-IN')}</td><td><span class="pill ${statusPill(s.status)}">${s.status}</span></td><td>${s.created}</td></tr>`).join('')}
   </tbody></table></div>`;}},
 purposes:{nav:'Purposes & Notice',icon:'purposes',group:'Setup',
  explain:{what:'Yahan site owner batata hai ki wo data kis-kis kaam ke liye leta hai. Banner mein yahi purposes dikhte hain.',
   build:['Purpose list: naam, description, retention period, linked scripts','Purpose add aur edit karne ka form','"Required" wala purpose user band nahi kar sakta','Notice version: text badalte hi naya version bane','Languages chunna (English + 22 bhashayein)'],
   api:[['GET','/v1/sites/{id}/purposes'],['PUT','/v1/sites/{id}/purposes/{pid}'],['POST','/v1/sites/{id}/notice/publish']]},
  render(){return `
   <div class="grid g-2-1">
    <div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>Purposes</h3><button class="btn sm" data-act="addPurpose">+ Naya purpose</button></div>
     <div class="tablewrap" style="border:0"><table><thead><tr><th>Purpose</th><th>Kis liye</th><th>Data kab tak</th><th>Scripts</th><th>Active</th></tr></thead><tbody>
     ${PURPOSES.map((p,i)=>`<tr><td><strong>${esc(p.name)}</strong>${p.required?'<br><span class="pill neutral">Required</span>':''}</td><td style="min-width:180px">${esc(p.desc)}</td><td>${esc(p.retention)}</td><td class="mono">${p.scripts.map(esc).join('<br>')}</td><td><label class="switch"><input type="checkbox" data-purpose="${i}" ${p.on?'checked':''} ${p.required?'disabled':''} aria-label="${esc(p.name)} active"><span></span></label></td></tr>`).join('')}
     </tbody></table></div>
    </div>
    <div class="grid" style="align-content:start">
     <div class="card"><h3>Notice version</h3>
      <div class="kv"><dt>Live version</dt><dd><span class="pill ok">v1.2</span> · 12 Nov 2026</dd><dt>Draft</dt><dd>Koi badlav nahi</dd></div>
      <p class="muted" style="font-size:12px">Purpose ya notice text badalne par naya version banega, aur purane users se dobara consent maanga jaayega.</p>
      <button class="btn" data-act="publishNotice">Naya version publish karo</button>
     </div>
     <div class="card"><h3>Languages</h3><div style="display:flex;flex-wrap:wrap;gap:6px">
      ${LANGS.map(([c,n,on],i)=>`<button class="btn sm" data-lang-i="${i}" aria-pressed="${on}" style="${on?'background:var(--accent-soft);border-color:var(--accent);color:var(--accent)':''}">${n}</button>`).join('')}
      <span class="muted" style="font-size:12px;align-self:center">+14 aur</span></div>
      <p class="muted" style="font-size:12px">DPDP ke hisaab se notice English aur 8th Schedule ki bhashaon mein dene ka option hona chahiye.</p></div>
    </div>
   </div>`;}},
 banner:{nav:'Banner Designer',icon:'banner',group:'Setup',
  explain:{what:'Site owner apne brand ke hisaab se banner ka look set karta hai. Right side mein live preview dikhta hai. Yahi banner client ki website par aayega.',
   build:['Position chunna: bottom bar, corner box, center popup','Brand color picker','Title aur text edit karna','Language preview (EN / हिंदी)','Live preview component (wahi component jo SDK mein jaayega)','Accept aur Reject button hamesha barabar dikhne chahiye'],
   api:[['GET','/v1/sites/{id}/banner'],['PUT','/v1/sites/{id}/banner']]},
  render(){const hi=banner.lang==='hi';const t=hi?HI_PREVIEW.title:banner.title,b=hi?HI_PREVIEW.body:banner.body;return `
   <div class="grid g2">
    <div class="card">
     <h3>Settings</h3>
     <div class="field">Position<div class="seg">${[['bar','Bottom bar'],['box','Corner box'],['center','Center popup']].map(([k,n])=>`<button data-pos="${k}" aria-pressed="${banner.pos===k}">${n}</button>`).join('')}</div></div>
     <div class="field">Brand color<div class="swatches">${['#0b6e57','#2d4a8a','#8a2d5a','#b8590f','#1d1d1d'].map(c=>`<button data-color="${c}" aria-pressed="${banner.color===c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
     <label class="field">Title<input class="input" id="bTitle" value="${esc(banner.title)}"></label>
     <label class="field">Text<textarea class="input" id="bBody" rows="3">${esc(banner.body)}</textarea><span class="hint">Simple bhasha mein likho. Hindi aur baaki bhashaon ka text Languages page se aayega.</span></label>
     <div class="field">Preview language<div class="seg"><button data-blang="en" aria-pressed="${!hi}">English</button><button data-blang="hi" aria-pressed="${hi}">हिंदी</button></div></div>
     <div class="field">Buttons<span class="hint">Accept all, Reject all aur Choose purposes teeno hamesha dikhenge. Reject ko chhupana dark pattern hai, isliye ye setting band nahi ho sakti.</span></div>
     <button class="btn primary" data-act="saveBanner" style="align-self:flex-start">Save aur publish</button>
    </div>
    <div class="card"><h3>Live preview</h3>
     <div class="preview-frame"><div class="preview-chrome"><i></i><i></i><i></i><span>demorealty.example</span></div>
      <div class="preview-site"><div class="ph-line" style="width:40%;height:18px"></div><div class="ph-line" style="width:80%"></div><div class="ph-line" style="width:65%"></div><div class="ph-line" style="width:72%"></div>
       <div class="cb ${banner.pos}"><h5>${esc(t)}</h5><p>${esc(b)}</p>
        <div class="acts"><span>${hi?HI_PREVIEW.reject:'Reject all'}</span><span>${hi?HI_PREVIEW.manage:'Choose purposes'}</span><span class="p" style="background:${banner.color};border-color:${banner.color}">${hi?HI_PREVIEW.accept:'Accept all'}</span></div>
        <p style="font-size:10px">Notice v1.2 · Grievance: grievance@demorealty.example</p></div>
      </div></div>
    </div>
   </div>`;}},
 plugin:{nav:'Plugin UI (user side)',icon:'banner',group:'Plugin (end user)',
  explain:{what:'Yeh wo UI hai jo customer ki website ya app par end user ko dikhega. Admin panel mein jo settings hain (purposes, banner color, languages), wahi yahan dikhti hain. Ise hum SDK ke andar Web Components ke roop mein banayenge.',
   build:['<dpdp-banner>: pehli visit par consent banner','<dpdp-parent-consent>: 18 se kam ke liye OTP flow','<dpdp-preferences>: purpose-wise toggles wala modal','<dpdp-fab>: "Manage consent" floating button','<dpdp-receipt>: user ki consent receipt','<dpdp-rights-form>: data rights request form + acknowledgement','Mobile par yahi UI bottom sheet ban jaata hai'],
   api:[['GET','/v1/config/{siteId}'],['POST','/v1/consent'],['POST','/v1/consent/withdraw'],['POST','/v1/parental-consent/otp'],['POST','/v1/parental-consent/verify'],['POST','/v1/rights-request']]},
  render(){
   const steps=[['banner','Banner'],['parent','Under 18'],['prefs','Preferences'],['done','Consent ke baad'],['receipt','Receipt'],['rights','Rights form'],['rightsDone','Request sent']];
   const mobile=pv.device==='mobile';
   const frame=mobile
    ?`<div class="phone"><div class="notch"></div><div class="pv-site">${fakeSite(true)}${pluginWidget(true)}</div></div>`
    :`<div class="preview-frame" style="width:100%"><div class="preview-chrome"><i></i><i></i><i></i><span>demorealty.example</span><span style="margin-left:auto;color:var(--accent)">dpdp.js v1.0</span></div><div class="pv-site">${fakeSite(false)}${pluginWidget(false)}</div></div>`;
   return `
   <div class="card">
    <div class="steps-seg" role="tablist" aria-label="Plugin ki screens">${steps.map(([k,n],i)=>`<button data-pstep="${k}" aria-pressed="${pv.step===k}"><b>${i+1}</b>${n}</button>`).join('')}</div>
    <div class="toolbar">
     <div class="seg"><button data-pdev="desktop" aria-pressed="${!mobile}">Desktop website</button><button data-pdev="mobile" aria-pressed="${mobile}">Mobile app</button></div>
     <div class="seg"><button data-plang="en" aria-pressed="${pv.lang==='en'}">English</button><button data-plang="hi" aria-pressed="${pv.lang==='hi'}">हिंदी</button></div>

   </div>
   <div class="grid g-2-1">

     <div><span class="eyebrow">Component</span><p class="mono" style="margin-top:4px">${esc(PNOTES[pv.step][2])}</p></div></div>
   </div>`;}},
 logs:{nav:'Consent Logs',icon:'logs',group:'Records',

    <div class="pw-head"><h5>${t.receiptTitle}</h5>${langSw()}</div><p class="txt">${t.receiptSub}</p>
    <div class="rcpt"><span>ID</span><span>RCPT-1Z8K4Q</span><span>Time</span><span>20 Nov 2026, 12:41</span><span>Notice</span><span>v1.2 · ${hi?'हिंदी':'English'}</span><span>Site</span><span>demorealty.example</span><span>Age</span><span>${pv.minor?'under 18 · parent verified':'18+'}</span></div>
    ${PURPOSES.filter(p=>p.on&&t.p[p.id]).map(p=>`<div class="prow" style="padding:6px 0"><span class="t" style="font-size:12px">${t.p[p.id][0]}</span><span class="pill ${p.required||(!pv.minor&&p.id!=='marketing')?'ok':'neutral'}">${p.required||(!pv.minor&&p.id!=='marketing')?'✓':'✕'}</span></div>`).join('')}
    <div class="acts"><button type="button" class="pb" data-pgo="prefs">${t.change}</button><button type="button" class="pb d" data-pact="withdraw">${t.withdraw}</button></div>
    <button type="button" class="pb" data-pgo="done">${t.close}</button></div>`;
  case 'rights':return `${dim}<form class="pw ${modal}" id="pRightsForm" aria-label="${t.rightsTitle}">
    <div class="pw-head"><h5>${t.rightsTitle}</h5>${langSw()}</div><p class="txt">${t.rightsSub}</p>
    <label>${t.type}<select class="inp">${t.types.map((x,i)=>`<option ${i===2?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>${t.email}<input class="inp" type="email" value="rahul.sample@example.com"></label>
    <label>${t.details}<textarea class="inp" rows="2">${hi?'मेरा अकाउंट और सारा डेटा हटा दीजिए।':'Please delete my account and all my data.'}</textarea></label>
    <span class="small">${t.grievance}: Anita Sharma · grievance@demorealty.example</span>
    <div class="acts"><button type="button" class="pb" data-pgo="done">${t.close}</button><button type="submit" class="pb p">${t.submit}</button></div></form>`;
  case 'rightsDone':return `${dim}<div class="pw ${modal}" role="dialog" aria-label="${t.ackTitle}" style="align-items:flex-start">
    <span class="ok-ic">✓</span><h5>${t.ackTitle}</h5>
    <p class="txt">${t.ackBody} <strong class="mono" style="color:var(--ink)">REQ-4K2P9A</strong></p>
    <p class="txt">${t.ackDue}: <strong style="color:var(--ink)">16 Feb 2027</strong></p>
    <p class="small">${t.ackNote}</p>
    <button type="button" class="pb p" style="align-self:stretch" data-pgo="done">${t.close}</button></div>`;
 }
 return '';
}
function stat(l,v,d,cls){return `<div class="card stat"><span class="eyebrow">${l}</span><span class="v">${v}</span><span class="d ${cls}">${d}</span></div>`;}

/* ================= shell render ================= */
function route(){const h=location.hash.slice(1);return PAGES[h]?h:'dashboard';}
function render(){
 const root=$('#root');
 if(!loggedIn){root.innerHTML=`<div class="login"><form class="dialog" id="loginForm" style="max-width:380px">
   <div class="brand" style="padding:0;color:var(--ink)">${logo()}DPDP Consent</div>
   <div><h2 style="font-size:20px">Sign in</h2><p class="muted" style="font-size:13px">Site owner ka login. Asli app mein email + password aur OTP hoga.</p></div>
   <label class="field">Email<input class="input" id="lEmail" type="email" value="owner@demorealty.example"></label>
   <label class="field">Password<input class="input" id="lPass" type="password" value="demo-password"></label>
   <button class="btn primary" type="submit">Sign in</button>
   <p class="muted" style="font-size:12px">Account nahi hai? Sign up karke pehli website add karo.</p>
  </form></div>`;return;}
 const r=route(),P=PAGES[r];const groups=[...new Set(Object.values(PAGES).map(p=>p.group))];
 root.innerHTML=`<div class="app">
  <aside class="side" id="side">
   <div class="brand">${logo()}DPDP Consent</div>
   ${groups.map(g=>`<div class="navgroup nav"><span class="lbl">${g}</span>${Object.entries(PAGES).filter(([,p])=>p.group===g).map(([k,p])=>`<a href="#${k}" ${k===r?'aria-current="page"':''}>${ico(p.icon)}${p.nav}${p.badge&&p.badge()?`<span class="badge">${p.badge()}</span>`:''}</a>`).join('')}</div>`).join('')}
   <div class="foot"><span>Prototype · sab data fake hai</span><a href="#" data-act="logout">Logout (login screen dekho)</a></div>
  </aside>
  <div class="main">
   <div class="topbar">
    <button class="menu-btn" data-act="menu" aria-label="Menu">☰</button>
    <div class="site-switch"><span class="eyebrow">Site</span><select id="siteSel" aria-label="Site chuno">${SITES.map(s=>`<option value="${s.id}" ${s.id===site?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="grow"></div>
    <label style="display:flex;gap:6px;align-items:center;font-size:12px" class="muted"><span class="switch"><input type="checkbox" id="explainToggle" ${showExplain?'checked':''}><span></span></span>Explanation dikhao</label>
    <div class="avatar" title="Site owner">PM</div>
   </div>
   <main class="content">
    <div class="page-head"><div><span class="eyebrow">${P.group}</span><h1>${P.nav}</h1></div></div>
    ${showExplain?explainBox(P.explain):''}
    ${P.render()}
   </main>
  </div>
 </div>
 ${drawer?drawerHTML():''}${dialog?dialogHTML():''}`;
}
function logo(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>`;}
function explainBox(e){return `<div class="explain">
  <div><h4>ⓘ Is screen ka kaam</h4><p style="font-size:13px;margin-bottom:8px">${e.what}</p><h4>Frontend mein kya banana hai</h4><ul>${e.build.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
  <div><h4>Backend se kaun si API chahiye</h4><div class="api">${e.api.map(([m,u])=>`<span><b>${m}</b>${u}</span>`).join('')}</div></div>
 </div>`;}

function drawerHTML(){const r=REQS.find(x=>x.id===drawer);const steps=[['Request aayi',r.ts,true],['User ki identity verify hui (OTP)',r.ts,true],['Team ne kaam shuru kiya','',r.status!=='New'],['User ko jawab bheja','',r.status==='Resolved'||r.status==='Rejected']];
 return `<div class="scrim" data-act="closeDrawer"><aside class="drawer" role="dialog" aria-label="Request ${r.id}" data-stop>
  <div style="display:flex;justify-content:space-between;gap:8px"><div><span class="eyebrow">${r.type} request</span><h2 style="font-size:20px" class="mono">${r.id}</h2></div><button class="btn sm" data-act="closeDrawer">Close</button></div>
  <span class="pill ${statusPill(r.status)}" style="align-self:flex-start">${r.status}</span>
  <dl class="kv"><dt>User</dt><dd>${esc(r.name)}</dd><dt>Email</dt><dd class="mono">${esc(r.email)}</dd><dt>Aaya</dt><dd>${r.ts}</dd><dt>Deadline</dt><dd>${r.due}</dd></dl>
  <div class="card" style="background:var(--surface-2)"><span class="eyebrow">User ka message</span><p>${esc(r.msg)}</p></div>
  ${r.type==='Erasure'?'<p class="muted" style="font-size:12px">Delete karne se pehle check karo ki koi law data rakhne ko to nahi kehta (jaise tax records).</p>':''}
  <div><span class="eyebrow">Timeline</span><ol class="timeline" style="margin-top:8px">${steps.map(([t,d,done])=>`<li class="${done?'':'pending'}">${t}${d?`<small>${d}</small>`:''}</li>`).join('')}</ol></div>
  <label class="field">User ko reply<textarea class="input" rows="3" id="replyTxt">Namaste ${esc(r.name.split(' ')[0])}, aapki request par kaam ho gaya hai.</textarea></label>
  <div class="toolbar">${r.status==='New'?'<button class="btn" data-rs="In progress">Kaam shuru karo</button>':''}${r.status!=='Resolved'&&r.status!=='Rejected'?'<button class="btn primary" data-rs="Resolved">Resolve + reply bhejo</button><button class="btn danger" data-rs="Rejected">Reject</button>':''}</div>
 </aside></div>`;}

function dialogHTML(){
 if(dialog.type==='receipt'){const l=LOGS[dialog.i];return `<div class="scrim center" data-act="closeDialog"><div class="dialog" role="dialog" aria-label="Consent receipt" data-stop>
  <span class="eyebrow">Consent receipt</span><h2 class="mono" style="font-size:18px">${l.receipt}</h2>
  <dl class="kv"><dt>User</dt><dd class="mono">${l.user}</dd><dt>Action</dt><dd><span class="pill ${actionPill(l.action)}">${l.action}</span></dd><dt>Time</dt><dd>${l.ts.toLocaleString('en-IN')}</dd><dt>Platform</dt><dd>${l.platform}</dd><dt>Notice</dt><dd>${l.notice} · ${l.lang==='hi'?'Hindi':'English'}</dd><dt>Age group</dt><dd>${l.age}${l.age==='under 18'?' · parent OTP verified':''}</dd><dt>Purposes</dt><dd>${pchips(l.p)}</dd><dt>IP (masked)</dt><dd class="mono">103.21.xxx.xxx</dd><dt>Hash</dt><dd class="mono" style="word-break:break-all">sha256:9f2c…e41a</dd></dl>
  <p class="muted" style="font-size:12px">Hash se pata chalta hai ki record baad mein badla nahi gaya.</p>
  <button class="btn" data-act="closeDialog" style="align-self:flex-end">Close</button></div></div>`;}
 const forms={
  addSite:['Website / app add karo',`<label class="field">Naam<input class="input" id="fName" value="Demo Realty iOS"></label><label class="field">URL ya package<input class="input" id="fUrl" value="com.demorealty.ios"></label><label class="field">Platform<select class="input" id="fPlat"><option>Website (script tag)</option><option>React / Next.js</option><option>WordPress plugin</option><option>Android SDK</option><option selected>iOS SDK</option><option>Flutter SDK</option></select></label>`,'Add karo'],
  addPurpose:['Naya purpose',`<label class="field">Naam<input class="input" id="fName" value="Location"></label><label class="field">Kis liye<input class="input" id="fDesc" value="Aas-paas ki properties dikhane ke liye location lena."></label><label class="field">Data kab tak rakhoge<select class="input" id="fRet"><option>6 mahine</option><option>12 mahine</option><option>24 mahine</option></select></label><label class="field">Linked scripts / SDKs<input class="input mono" id="fScr" value="maps-sdk.js"></label>`,'Save'],
  addBreach:['Breach report karo',`<label class="field">Kya hua<input class="input" id="fName" value="Email list galti se public share hui"></label><label class="field">Kitne users affected<input class="input" id="fAff" type="number" value="120"></label><label class="field">Kaun sa data<input class="input" id="fData" value="Email"></label><p class="muted" style="font-size:12px">Save karne ke baad Board ko report bhejna aur users ko email karna hoga.</p>`,'Save report'],
  invite:['Member invite karo',`<label class="field">Email<input class="input" type="email" value="newmember@demorealty.example"></label><label class="field">Role<select class="input"><option>Viewer</option><option>Developer</option><option>DPO</option><option>Admin</option></select></label>`,'Invite bhejo']
 }[dialog.type];
 return `<div class="scrim center" data-act="closeDialog"><form class="dialog" id="dlgForm" data-stop><h2 style="font-size:18px">${forms[0]}</h2>${forms[1]}<div class="toolbar" style="justify-content:flex-end"><button type="button" class="btn" data-act="closeDialog">Cancel</button><button class="btn primary" type="submit">${forms[2]}</button></div></form></div>`;
}

/* ================= events ================= */
document.addEventListener('click',e=>{
 let a=e.target.closest('[data-act]');
 // scrim par sirf bahar click karne se band ho, drawer ke andar click se nahi
 if(a&&a.classList.contains('scrim')&&e.target!==a)a=null;
 if(a){
  const act=a.dataset.act;
  e.preventDefault();
  switch(act){
   case 'logout':loggedIn=false;render();return;
   case 'menu':$('#side').classList.toggle('open');return;
   case 'closeDrawer':drawer=null;render();return;
   case 'closeDialog':dialog=null;render();return;
   case 'addSite':case 'addPurpose':case 'addBreach':case 'invite':dialog={type:act};render();return;
   case 'publishNotice':toast('Notice v1.3 publish hua. Purane users ko agli visit par naya banner dikhega.');return;
   case 'saveBanner':toast('Banner save hua. Client ki site par 1 minute mein update ho jaayega.');return;
   case 'saveSettings':toast('Settings save ho gayi.');return;
   case 'export':toast('Asli app mein yahan CSV download hoga.');return;
   case 'copy':{const txt=CODE[codeTab].c.replace(/<\\\//g,'</');if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Code copy ho gaya.'),()=>toast('Copy nahi hua, code select karke copy karo.'));return;}
  }
 }
 const t=e.target;
 /* plugin preview interactions */
 const pg=t.closest('[data-pgo]');
 if(pg){const to=pg.dataset.pgo;if(to==='parent'){pv.minor=true;pv.otpSent=false;}else if(pg.dataset.minor){pv.minor=true;}pv.step=to;render();return;}
 const ps=t.closest('[data-pstep]');
 if(ps){pv.step=ps.dataset.pstep;if(pv.step==='banner'){pv.minor=false;pv.age=null;}if(pv.step==='parent'){pv.minor=true;pv.otpSent=false;}render();return;}
 if(t.closest('[data-pdev]')){pv.device=t.closest('[data-pdev]').dataset.pdev;render();return;}
 if(t.closest('[data-plang]')){pv.lang=t.closest('[data-plang]').dataset.plang;render();return;}
 if(t.closest('[data-page]')){pv.age='adult';pv.minor=false;render();return;}
 const pa=t.closest('[data-pact]');
 if(pa){if(pa.dataset.pact==='otp'){pv.otpSent=true;render();}else if(pa.dataset.pact==='withdraw'){pv.step='done';render();toast('Demo: consent withdraw hua. Saari tracking scripts band, ledger mein WITHDRAW entry.');}return;}
 if(t.closest('[data-pos]')){banner.pos=t.closest('[data-pos]').dataset.pos;render();return;}
 if(t.closest('[data-color]')){banner.color=t.closest('[data-color]').dataset.color;render();return;}
 if(t.closest('[data-blang]')){banner.lang=t.closest('[data-blang]').dataset.blang;render();return;}
 if(t.closest('[data-code]')){codeTab=t.closest('[data-code]').dataset.code;render();return;}
 if(t.closest('[data-rf]')){reqFilter=t.closest('[data-rf]').dataset.rf;render();return;}
 if(t.closest('[data-lang-i]')){const i=+t.closest('[data-lang-i]').dataset.langI;if(i>0)LANGS[i][2]=!LANGS[i][2];else toast('English hamesha on rahegi.');render();return;}
 if(t.closest('[data-req]')){drawer=t.closest('[data-req]').dataset.req;render();return;}
 if(t.closest('[data-log]')){dialog={type:'receipt',i:+t.closest('[data-log]').dataset.log};render();return;}
 if(t.closest('[data-rs]')){const s=t.closest('[data-rs]').dataset.rs;const r=REQS.find(x=>x.id===drawer);r.status=s;toast(s==='Resolved'?`${r.id} resolve hui, user ko email gaya.`:s==='Rejected'?`${r.id} reject hui, user ko reason ke saath email gaya.`:`${r.id} par kaam shuru.`);render();return;}
 if(t.closest('.nav a')&&window.innerWidth<=860){$('#side')&&$('#side').classList.remove('open');}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(drawer||dialog)){drawer=null;dialog=null;render();}
 if(e.key==='Enter'){const r=e.target.closest&&e.target.closest('tr.click');if(r)r.click();}
});
document.addEventListener('change',e=>{
 if(e.target.id==='siteSel'){site=e.target.value;toast('Site badli: '+SITES.find(s=>s.id===site).name);}
 if(e.target.id==='explainToggle'){showExplain=e.target.checked;render();}
 if(e.target.id==='logFilter'){logFilter=e.target.value;render();}
 if(e.target.dataset&&e.target.dataset.purpose!==undefined){const p=PURPOSES[+e.target.dataset.purpose];p.on=e.target.checked;toast(`${p.name} ${p.on?'on':'off'}. Naya notice version publish karna hoga.`);}
});
document.addEventListener('input',e=>{
 if(e.target.id==='bTitle'){banner.title=e.target.value;const h=document.querySelector('.cb h5');if(h&&banner.lang==='en')h.textContent=banner.title;}
 if(e.target.id==='bBody'){banner.body=e.target.value;const p=document.querySelector('.cb p');if(p&&banner.lang==='en')p.textContent=banner.body;}
 if(e.target.id==='logSearch'){logSearch=e.target.value;const pos=e.target.selectionStart;render();const s=$('#logSearch');s.focus();s.setSelectionRange(pos,pos);}
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='pRightsForm'){pv.step='rightsDone';render();return;}
 if(e.target.id==='loginForm'){loggedIn=true;location.hash='#dashboard';render();toast('Login ho gaya.');return;}
 if(e.target.id==='dlgForm'){const ty=dialog.type;const v=id=>{const el=$('#'+id);return el?el.value:'';};
  if(ty==='addSite'){SITES.push({id:'site_'+Math.random().toString(16).slice(2,8),name:v('fName'),url:v('fUrl'),platform:v('fPlat'),status:'Not installed',consents:0,created:'20 Nov 2026'});toast('Site add hui. Ab Install page se code lagao.');}
  if(ty==='addPurpose'){PURPOSES.push({id:v('fName').toLowerCase(),name:v('fName'),desc:v('fDesc'),required:false,retention:v('fRet'),scripts:v('fScr').split(',').map(s=>s.trim()),on:true});toast('Purpose add hua. Notice ka naya version banana hoga.');}
  if(ty==='addBreach'){BREACHES.unshift({id:'BR-2026-00'+(BREACHES.length+1),title:v('fName'),found:'20 Nov 2026',affected:+v('fAff'),data:v('fData'),status:'Board ko report baaki',users:'Users ko batana baaki'});toast('Breach save hua. Ab Board aur users ko notify karo.');}
  if(ty==='invite')toast('Invite bheja gaya.');
  dialog=null;render();}
});
window.addEventListener('hashchange',()=>{drawer=null;dialog=null;render();window.scrollTo(0,0);});
render();
})();
</script>
</body>
